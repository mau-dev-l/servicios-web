services:
  db:
    image: mysql:8.0
    container_name: servicios-web-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-demo_db}
      MYSQL_USER: ${DB_USER:-api_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - set it in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # Puerto publicado en tu maquina. El 3306 del host esta ocupado por tu
      # MySQL local, por eso se publica en 3307 por defecto.
      # Para cambiarlo: DB_HOST_PORT=XXXX docker compose up -d
      # (la comunicacion interna api->db sigue usando el 3306 del contenedor).
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    container_name: servicios-web-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

  web:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: servicios-web-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  n8n:
    image: n8nio/n8n:2.42.6
    container_name: servicios-web-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_HOST: hour-aid-tricks-symposium.trycloudflare.com 
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://hour-aid-tricks-symposium.trycloudflare.com
      N8N_WEBHOOK_URL: https://hour-aid-tricks-symposium.trycloudflare.com
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "2"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  db_data:
  n8n_data:
